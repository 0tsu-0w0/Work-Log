<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1>Work Log</h1>
    <div class="nav">
      <button id="prev" title="前の週">‹</button>
      <button id="today">今週</button>
      <button id="next" title="次の週">›</button>
      <span id="range" class="range"></span>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="キーワード検索(全期間)">
      <select id="project"><option value="">すべてのプロジェクト</option></select>
      <select id="tag"><option value="">すべてのタグ</option></select>
      <span id="live" class="live" title="ログの変更を監視中">●</span>
    </div>
  </header>

  <main class="layout">
    <section class="calendar" id="calendar">
      <div class="cal-head" id="cal-head"></div>
      <div class="cal-body" id="cal-body">
        <div class="hours" id="hours"></div>
        <div class="days" id="days"></div>
      </div>
    </section>

    <aside class="side">
      <div id="search-results" class="search-results" hidden></div>
      <div id="detail" class="detail">
        <div class="stats" id="week-stats"></div>
        <p class="hint">ブロックを選ぶと、セッションの詳細を表示します。</p>
      </div>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
